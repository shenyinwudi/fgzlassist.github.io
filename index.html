<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="法官助理工作台">
<meta name="theme-color" content="#1b3a5c">
<title>法官助理工作台</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
:root{
  --ink:#1b3a5c; --ink-2:#2c5c8f; --bg:#f2f4f7; --card:#fff;
  --line:#e3e7ee; --text:#1d2733; --sub:#6b7787;
  --red:#c62f2f; --red-bg:#fdecec; --orange:#b26800; --orange-bg:#fff5e3;
  --green:#1f7a4d; --green-bg:#e9f6ef; --blue-bg:#eaf2fb;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.5;
  -webkit-text-size-adjust:100%; overscroll-behavior-y:none;
}
/* ---------- 框架 ---------- */
.app{max-width:780px;margin:0 auto;min-height:100vh;background:var(--bg)}
.hd{
  position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;
  padding:calc(10px + var(--sat)) 16px 10px;
}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hd h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.5px}
.hd .date{font-size:12px;opacity:.78;margin-top:2px}
.hd .wk{font-size:12px;background:rgba(255,255,255,.16);padding:3px 9px;border-radius:20px;white-space:nowrap}
.main{padding:14px 14px calc(80px + var(--sab));}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(255,255,255,.97); backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  display:flex; padding-bottom:var(--sab); max-width:780px; margin:0 auto;
}
.tabbar button{
  flex:1;border:0;background:none;padding:7px 0 8px;font-size:11px;color:var(--sub);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;cursor:pointer;
}
.tabbar button .ico{font-size:20px;line-height:1;font-variation-settings:'wght' 400}
.tabbar button.on{color:var(--ink);font-weight:600}
.tabbar button.on .ico{transform:translateY(-1px)}
.tabbar .plus .ico{
  width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:300;
  margin-top:-14px;box-shadow:0 3px 10px rgba(27,58,92,.35);line-height:1;
}
/* ---------- 通用 ---------- */
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card.tight{padding:0;overflow:hidden}
.sec-t{display:flex;align-items:center;gap:8px;margin:18px 2px 10px;font-size:13px;color:var(--sub);font-weight:600;letter-spacing:.3px}
.sec-t .n{background:var(--line);color:var(--sub);border-radius:20px;padding:0 7px;font-size:11px;line-height:18px}
.sec-t .n.hot{background:var(--red);color:#fff}
.sec-t .n.warm{background:var(--orange);color:#fff}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:36px 10px;line-height:1.9}
.empty .big{font-size:34px;display:block;margin-bottom:8px;opacity:.35}
.btn{
  border:0;border-radius:9px;padding:11px 16px;font-size:15px;font-family:inherit;
  background:var(--ink);color:#fff;font-weight:500;cursor:pointer;
}
.btn:active{opacity:.82}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #c7d2e0}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:7px}
.btn.danger{background:#fff;color:var(--red);border:1px solid #edc9c9}
.btn.block{width:100%;display:block}
.btn-row{display:flex;gap:9px}
.btn-row .btn{flex:1}
/* ---------- 任务条目 ---------- */
.task{padding:13px 14px;border-bottom:1px solid var(--line);position:relative}
.task:last-child{border-bottom:0}
.task.od{background:linear-gradient(90deg,var(--red-bg),#fff 55%)}
.task.td{background:linear-gradient(90deg,var(--orange-bg),#fff 55%)}
.task .l1{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.task .cs{font-size:15px;font-weight:600;letter-spacing:.2px;word-break:break-all}
.task .cname{font-size:13px;color:var(--sub);margin-top:3px}
.task .l2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;font-size:12px}
.tag{padding:2px 8px;border-radius:5px;font-size:11.5px;background:var(--blue-bg);color:var(--ink-2);white-space:nowrap}
.tag.cat{background:#eef1f6;color:#43536b}
.tag.due{background:var(--orange-bg);color:var(--orange);font-weight:600}
.tag.od{background:var(--red-bg);color:var(--red);font-weight:600}
.tag.ok{background:var(--green-bg);color:var(--green)}
.tag.wk{background:#f0edf9;color:#5b46a8}
.task .step{font-size:13.5px;margin-top:7px;color:#33414f}
.task .step b{font-weight:600}
.task .acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;align-items:center}
.chk{
  border:0;background:var(--green-bg);color:var(--green);border-radius:7px;padding:6px 12px;
  font-size:13.5px;font-family:inherit;font-weight:500;cursor:pointer;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.chk:active{opacity:.75}
/* ---------- 表单 ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{
  width:100%;padding:11px 12px;font-size:16px;font-family:inherit;color:var(--text);
  border:1px solid #d3dae5;border-radius:9px;background:#fff;outline:none;
  -webkit-appearance:none;appearance:none;
}
.field select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%236b7787' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:34px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink-2);box-shadow:0 0 0 3px rgba(44,92,143,.1)}
.field .hint{font-size:11.5px;color:var(--sub);margin-top:4px;line-height:1.5}
.row2{display:flex;gap:10px}
.row2>*{flex:1;min-width:0}
/* ---------- 弹层 ---------- */
.sheet-mask{position:fixed;inset:0;background:rgba(15,25,38,.42);z-index:100;display:none;opacity:0;transition:opacity .2s}
.sheet-mask.on{display:block;opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:101;background:#f7f8fa;border-radius:16px 16px 0 0;
  max-height:92vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-width:780px;margin:0 auto;
}
.sheet.on{transform:translateY(0)}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line);flex:0 0 auto;background:#fff;border-radius:16px 16px 0 0}
.sheet-hd h2{margin:0;font-size:16px;font-weight:600}
.sheet-hd .x{border:0;background:none;font-size:22px;color:var(--sub);padding:0 4px;cursor:pointer;line-height:1}
.sheet-bd{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px;flex:1 1 auto}
.sheet-ft{padding:10px 16px calc(10px + var(--sab));border-top:1px solid var(--line);background:#fff;flex:0 0 auto}
/* ---------- 台账表格 ---------- */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:11px;border:1px solid var(--line);background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:100%}
th{background:#f0f3f8;color:#44536a;font-weight:600;text-align:left;padding:9px 10px;white-space:nowrap;font-size:12.5px;border-bottom:1px solid var(--line);position:sticky;top:0}
td{padding:9px 10px;border-bottom:1px solid #eef1f5;white-space:nowrap;vertical-align:top}
tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;min-width:120px}
/* ---------- 分类选择 ---------- */
.cats{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.chip{
  border:1px solid #d3dae5;background:#fff;border-radius:8px;padding:8px 12px;font-size:13.5px;
  font-family:inherit;color:#3a4757;cursor:pointer;line-height:1.2;
}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
.chip.sm{padding:6px 10px;font-size:12.5px}
/* ---------- 语音输入 ---------- */
.mic{
  border:1px solid #cdd8e6;background:#fff;color:var(--ink-2);border-radius:8px;
  padding:5px 11px;font-size:12.5px;font-family:inherit;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px;line-height:1.3;
}
.mic:active{opacity:.7}
.mic.rec{background:var(--red);color:#fff;border-color:var(--red);animation:micpulse 1.1s ease-in-out infinite}
@keyframes micpulse{0%,100%{opacity:1}50%{opacity:.55}}
.dict-tip{
  margin-top:8px;background:var(--blue-bg);border:1px dashed #b9cde6;border-radius:8px;
  padding:9px 11px;font-size:12.5px;color:#2a4a70;line-height:1.65;
}
/* ---------- 今日概览 ---------- */
.ov{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px}
.ov .cell{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 6px;text-align:center}
.ov .v{font-size:20px;font-weight:700;line-height:1.15;letter-spacing:-.5px}
.ov .k{font-size:11px;color:var(--sub);margin-top:3px}
.ov .cell.r .v{color:var(--red)} .ov .cell.o .v{color:var(--orange)} .ov .cell.g .v{color:var(--green)}
/* ---------- 时间轴 ---------- */
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:#dfe5ee}
.tl .nd{position:relative;padding:0 0 16px}
.tl .nd:last-child{padding-bottom:0}
.tl .nd::before{content:'';position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #b9c5d6}
.tl .nd.done::before{background:var(--green);border-color:var(--green)}
.tl .nd.now::before{background:var(--orange);border-color:var(--orange);box-shadow:0 0 0 4px rgba(178,104,0,.14)}
.tl .nd .nm{font-size:14px;font-weight:600}
.tl .nd.done .nm{color:var(--sub);text-decoration:line-through;font-weight:500}
.tl .nd .dt{font-size:12.5px;color:var(--sub);margin-top:2px}
/* ---------- 提示 ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translate(-50%,12px);
  background:rgba(28,40,55,.94);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;
  z-index:200;opacity:0;transition:.24s;pointer-events:none;max-width:86vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.note{background:var(--blue-bg);border-left:3px solid var(--ink-2);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px;color:#2a4a70;line-height:1.65;margin-bottom:12px}
.note.warn{background:var(--orange-bg);border-left-color:var(--orange);color:#7a4a00}
.note b{font-weight:600}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;background:#eef1f6;color:#4a5a70;margin:0 5px 5px 0}
.seg{display:flex;background:#e6eaf1;border-radius:9px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;font-size:13.5px;font-family:inherit;color:#4a5a70;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.09)}
.srch{position:relative;margin-bottom:12px}
.srch input{width:100%;padding:11px 12px 11px 36px;font-size:16px;border-radius:10px;border:1px solid #d3dae5;background:#fff;font-family:inherit;outline:none}
.srch::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5}
.stat-line{display:flex;gap:14px;font-size:12.5px;color:var(--sub);padding:9px 14px;background:#fafbfd;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stat-line b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <div class="hd-row">
      <div>
        <h1 id="hTitle">今日工作台</h1>
        <div class="date" id="hDate"></div>
      </div>
      <div class="wk" id="hWeek"></div>
    </div>
  </header>
  <main class="main" id="view"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="today" class="on"><span class="ico">☰</span>今日</button>
    <button data-tab="tasks"><span class="ico">▤</span>任务</button>
    <button data-tab="add" class="plus"><span class="ico">+</span></button>
    <button data-tab="board"><span class="ico">▦</span>台账</button>
    <button data-tab="set"><span class="ico">⚙</span>设置</button>
  </nav>
</div>

<div class="sheet-mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="sheet-hd"><h2 id="sheetTitle">录入任务</h2><button class="x" id="sheetX">✕</button></div>
  <div class="sheet-bd" id="sheetBody"></div>
  <div class="sheet-ft" id="sheetFoot"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   法官助理工作台  —  单文件离线应用
   数据全部保存在本机浏览器 (localStorage)
   ============================================================ */
'use strict';
/* ========== 1. 日期工具 ========== */
const pad = n => (n < 10 ? '0' : '') + n;
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseYmd = s => { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const todayStr = () => ymd(new Date());
const WEEKCN = ['日', '一', '二', '三', '四', '五', '六'];

/* ========== 2. 法定节假日（2026年国办发明电〔2025〕7号） ========== */
const DEFAULT_HOLIDAYS = {
  '2026-01-01': '元旦', '2026-01-02': '元旦', '2026-01-03': '元旦',
  '2026-02-15': '春节', '2026-02-16': '春节', '2026-02-17': '春节', '2026-02-18': '春节',
  '2026-02-19': '春节', '2026-02-20': '春节', '2026-02-21': '春节', '2026-02-22': '春节', '2026-02-23': '春节',
  '2026-04-04': '清明', '2026-04-05': '清明', '2026-04-06': '清明',
  '2026-05-01': '劳动节', '2026-05-02': '劳动节', '2026-05-03': '劳动节', '2026-05-04': '劳动节', '2026-05-05': '劳动节',
  '2026-06-19': '端午', '2026-06-20': '端午', '2026-06-21': '端午',
  '2026-09-25': '中秋', '2026-09-26': '中秋', '2026-09-27': '中秋',
  '2026-10-01': '国庆', '2026-10-02': '国庆', '2026-10-03': '国庆', '2026-10-04': '国庆',
  '2026-10-05': '国庆', '2026-10-06': '国庆', '2026-10-07': '国庆',
  '2027-01-01': '元旦(待公布)', '2027-01-02': '元旦(待公布)', '2027-01-03': '元旦(待公布)'
};
// 调休上班日（周末上班）
const DEFAULT_MAKEUP = ['2026-01-04', '2026-02-14', '2026-02-28', '2026-05-09', '2026-09-20', '2026-10-10'];

/* ========== 3. 业务类别与子类别 ========== */
const CATS = [
  { k: '保全', ic: '🛡', subs: ['安排保全谈话', '首次保全', '续行保全', '解除保全'] },
  { k: '排庭', ic: '📅', subs: ['排一次庭', '排二次庭'] },
  { k: '送达', ic: '📨', subs: ['起诉状证据传票送达', '判决书送达', '调解书送达', '管辖异议裁定送达', '公告送达', '其他送达'] },
  { k: '调查', ic: '🔍', subs: ['开具调查令', '开具协查函并发送', '线下调查'] },
  { k: '鉴定', ic: '🧪', subs: ['安排鉴定谈话', '提鉴定系统', '补充鉴定材料'] },
  { k: '文书校核', ic: '✓', subs: ['文书校核'] },
  { k: '移送上诉', ic: '⬆', subs: ['送达上诉状副本并开具上诉费缴费单', '制作移送上诉材料并送扫', '点击移送上诉'] },
  { k: '制作文书', ic: '✎', subs: ['制作文书'] },
  { k: '审限扣除与报结', ic: '⏱', subs: ['审限扣除与报结'] },
  { k: '退费', ic: '¥', subs: ['退费'] },
  { k: '归档', ic: '📦', subs: ['归档'] }
];

/* ========== 4. 期限规则库 ==========
   step: n 节点名 | off 偏移 | unit 'w'工作日 'd'自然日 | base 'start'起算日 'prev'上一节点
         snap 'back'遇休向前取工作日 'fwd'向后取工作日 | opt 可选节点 | tag 节点类型
   说明：工作日计算遵循民诉法第85条——起算日不计入，自次日起算
=================================================== */
const RULES = {
  '保全|安排保全谈话': {
    fields: ['标的物'], life: '7个工作日',
    steps: [{ n: '安排保全谈话', off: 7, unit: 'w', base: 'start', tag: 'talk' }],
    note: '记录后7个工作日内安排保全谈话'
  },
  '保全|首次保全': {
    fields: ['标的物'], life: '谈话后2日出裁定→1日审批→1日移送',
    steps: [
      { n: '出保全裁定和流转表', off: 2, unit: 'w', base: 'start' },
      { n: '提审批单', off: 1, unit: 'w', base: 'prev' },
      { n: '移送执行局保全组', off: 1, unit: 'w', base: 'prev' },
      { n: '执行立案（跟进）', off: 0, unit: 'w', base: 'prev', tag: 'follow' }
    ],
    note: '起算日＝保全谈话完成日。裁定后1日内提审批单，审批单出具后1日内移送执行局保全组，之后定期询问进度并记录'
  },
  '保全|续行保全': {
    fields: ['标的物', '保全到期日'], needEnd: true, life: '到期前32日出裁定',
    steps: [
      { n: '出续行保全裁定和流转表', off: -32, unit: 'd', base: 'end', snap: 'back' },
      { n: '提审批单', off: 1, unit: 'w', base: 'prev' },
      { n: '移送执行局保全组', off: 1, unit: 'w', base: 'prev' }
    ],
    note: '以保全到期日倒推32日制作裁定，裁定后1日提审批单，审批单出具后1日移送执行局'
  },
  '保全|解除保全': {
    fields: ['标的物'], life: '5日出裁定',
    steps: [
      { n: '出解除保全裁定和流转表', off: 5, unit: 'w', base: 'start' },
      { n: '提审批单', off: 1, unit: 'w', base: 'prev' },
      { n: '移送执行局保全组', off: 1, unit: 'w', base: 'prev' }
    ],
    note: '记录后5个工作日内出裁定和流转表，之后逐级提审批单、移送执行局'
  },

  '排庭|排一次庭': {
    fields: ['当事人'], life: '5个工作日',
    steps: [{ n: '确定开庭时间并记入排庭表', off: 5, unit: 'w', base: 'start' }],
    note: '记录后5个工作日内将案件记入排庭表。排庭表累计超过5件时，软件会提示可联系送达人员移送'
  },
  '排庭|排二次庭': {
    fields: ['当事人'], life: '3个工作日',
    steps: [{ n: '联系双方确定开庭时间并制发传票', off: 3, unit: 'w', base: 'start' }],

/* ========== 6. 存储层 ========== */
const KEY = 'fzr_assistant_v2';

  tasks: [], holidays: Object.assign({}, DEFAULT_HOLIDAYS), makeup: DEFAULT_MAKEUP.slice(),
  seq: { 保全: 1 }, remindDay: 1, hasData: false, v: 2
};
let HOL = {}, MAKEUP = new Set(), MEMFALLBACK = null;

function loadDB() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const o = JSON.parse(raw); DB = Object.assign(DB, o); }
  } catch (e) { DB = MEMFALLBACK || DB; }
  if (!DB.holidays || !Object.keys(DB.holidays).length) DB.holidays = Object.assign({}, DEFAULT_HOLIDAYS);
  if (!DB.makeup || !DB.makeup.length) DB.makeup = DEFAULT_MAKEUP.slice();
  HOL = DB.holidays; MAKEUP = new Set(DB.makeup);
  (DB.tasks || []).forEach(t => recalc(t));
}
function saveDB() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch (e) { MEMFALLBACK = JSON.parse(JSON.stringify(DB)); console.warn('存储不可用，已暂存内存', e); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ========== 7. 期限引擎 ========== */
function refreshCal() { HOL = DB.holidays; MAKEUP = new Set(DB.makeup); }
function isWorkday(s) {
  if (!s) return false;
  if (MAKEUP.has(s)) return true;
  if (HOL[s]) return false;
  const w = parseYmd(s).getDay();
  return w !== 0 && w !== 6;
}
// 自次日起数 n 个工作日（n 可为负，负数向前数）
function shiftWorkdays(start, n) {
  if (!n) return start;
  const dir = n > 0 ? 1 : -1;
  const cur = parseYmd(start); let cnt = 0, guard = 0;
  while (cnt < Math.abs(n) && guard++ < 6000) {
    cur.setDate(cur.getDate() + dir);
    if (isWorkday(ymd(cur))) cnt++;
  }
  return ymd(cur);
}
function shiftDays(start, n) {
  const d = parseYmd(start); d.setDate(d.getDate() + n); return ymd(d);
}
function snapWorkday(s, dir) {
  const d = parseYmd(s); let guard = 0;
  while (!isWorkday(ymd(d)) && guard++ < 40) d.setDate(d.getDate() + dir);
  return ymd(d);
}
function diffDays(a, b) { return Math.round((parseYmd(a) - parseYmd(b)) / 86400000); }
function fmtCN(s) {
  if (!s) return '—';
  const d = parseYmd(s);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
function fmtFull(s) {
  if (!s) return '—';
  const d = parseYmd(s);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' 周' + WEEKCN[d.getDay()];
}
// 节假日名称（用于提示"因节假日顺延"）
function holidayName(s) { return HOL[s] || ''; }

/* ========== 8. 任务计算 ========== */
function ruleOf(t) { return RULES[t.cat + '|' + t.sub] || RULES[t.cat] || { steps: [] }; }

function recalc(t) {
  const rule = ruleOf(t);
  const old = t.steps || [];
  const out = [];
  const absOn = (t.dueMode === 'absolute' && !!t.absDue);
  const startBase = absOn ? t.absDue : t.start;
  const firstOff = (rule.steps && rule.steps[0]) ? rule.steps[0].off : 0;
  const firstUnit = (rule.steps && rule.steps[0]) ? rule.steps[0].unit : 'w';
  let prevBase = startBase;
  (rule.steps || []).forEach((s, si) => {
    let base;
    if (s.base === 'end') base = t.endDate || t.start;
    else if (s.base === 'prev') base = prevBase;
    else base = startBase;
    let off = s.off;
    // 自定义期限：仅覆盖以起算日为基准的第一个工作日节点
    if (si === 0 && s.base === 'start' && s.unit === 'w' &&
      t.customDays !== null && t.customDays !== undefined && t.customDays !== '' && !isNaN(t.customDays)) {
      off = Number(t.customDays);
    }
    // 指定日期模式：并联节点保持与首节点的相对间隔，不整体平移
    if (si > 0 && absOn && s.base === 'start' && s.unit === firstUnit) off = s.off - firstOff;
    // 首个节点锁定为指定日期，不顺延
    const isAbs = (si === 0 && absOn);
    let due = isAbs ? t.absDue : (s.unit === 'w' ? shiftWorkdays(base, off) : shiftDays(base, off));
    if (!isAbs && s.snap) due = snapWorkday(due, s.snap === 'back' ? -1 : 1);
    const o = old.find(x => x.n === s.n) || {};
    out.push({ n: s.n, due: due, tag: s.tag || '', done: !!o.done, doneAt: o.doneAt || '' });
    prevBase = o.done ? (o.doneAt || due) : due;
  });
  // 可选节点（如上诉状需补正）
  if (rule.optStep) {
    const key = rule.optStep.when;
    const enabled = t.extra && t.extra[key] === true;
    if (enabled) {
      const s = rule.optStep;
      const o = old.find(x => x.n === s.n) || {};
      out.push({ n: s.n, due: shiftWorkdays(t.start, s.off), tag: 'opt', done: !!o.done, doneAt: o.doneAt || '', opt: true });
    }
  }
  t.steps = out;
  return t;
}

// 下一个待办节点
function nextStep(t) {
  return (t.steps || []).find(s => !s.done) || null;
}
function minDue(t) {
  const pend = (t.steps || []).filter(s => !s.done);
  if (!pend.length) return null;
  return pend.map(s => s.due).sort()[0];
}
function isAllDone(t) { return (t.steps || []).length > 0 && (t.steps || []).every(s => s.done); }

/* 任务状态：overdue 逾期 / today 今日到期 / soon 3日内 / upcoming / done */
function stateOf(t) {
  if (isAllDone(t)) return 'done';
  const d = minDue(t);
  if (!d) return 'upcoming';
  const n = diffDays(d, todayStr());
  if (n < 0) return 'overdue';
  if (n === 0) return 'today';
  if (n <= 3) return 'soon';
  return 'upcoming';
}

/* 台账"当前状态"推导 */
function progressOf(t) {
  const doneSet = new Set((t.steps || []).filter(s => s.done).map(s => s.n));
  if (t.cat === '退费') {
    const f = ruleOf(t).flow || [];
    return f[t.flow || 0] || f[0] || '—';
  }
  if (t.cat === '保全') {
    if (t.sub === '安排保全谈话') return doneSet.has('安排保全谈话') ? '谈话已完成' : '待安排谈话';
    if (doneSet.has('执行立案（跟进）')) return '执行立案';
    if (doneSet.has('移送执行局保全组')) return '已经移送执行';
    if (doneSet.has('提审批单')) return '已经提审批单';
    if (doneSet.has('出保全裁定和流转表') || doneSet.has('出续行保全裁定和流转表') || doneSet.has('出解除保全裁定和流转表')) return '已出裁定';
    return '保全谈话完毕';
  }
  if (t.cat === '送达') return doneSet.has('完成送达') ? '已送达' : '未送达';
  if (t.cat === '移送上诉') {
    const nx = nextStep(t);
    return nx ? '待：' + nx.n : '全部完成';
  }
  if (t.sub === '线下调查') return doneSet.has('完成线下调查') ? '已完成' : '进行中';
  const all = t.steps || [];
  if (!all.length) return '进行中';
  if (all.every(s => s.done)) return '已完成';
  const nx = nextStep(t);
  return nx ? '待：' + nx.n : '进行中';
}

/* 新建任务 */
function makeTask(o) {
  const t = {
    id: uid(), cat: o.cat, sub: o.sub, caseNo: (o.caseNo || '').trim(), caseName: (o.caseName || '').trim(),
    start: o.start || todayStr(), endDate: o.endDate || '', extra: o.extra || {},
    steps: [], flow: 0, logs: [], status: 'doing', doneAt: '', createdAt: new Date().toISOString(),
    customDays: (o.customDays === undefined ? null : o.customDays),
    dueMode: o.dueMode || 'relative', absDue: o.absDue || ''
  };
  if (t.cat === '保全' && !t.extra.seqNo) { t.extra.seqNo = DB.seq[t.cat] || 1; DB.seq[t.cat] = (DB.seq[t.cat] || 1) + 1; }
  recalc(t);
  return t;
}

  { re: /(移送材料|送扫|扫描|移送上诉材料)/, cat: '移送上诉', sub: '制作移送上诉材料并送扫' },
  { re: /(点击移送|移送上诉|上诉移送)/, cat: '移送上诉', sub: '点击移送上诉' },
  { re: /(扣审|审限扣除|报结|结案)/, cat: '审限扣除与报结', sub: '审限扣除与报结' },
  { re: /(退费|退诉讼费|退钱)/, cat: '退费', sub: '退费' },
  { re: /(归档|立卷|装卷)/, cat: '归档', sub: '归档' },
  { re: /(送达|邮寄|发文书)/, cat: '送达', sub: '其他送达' }
];
const ORG_RE = /([\u4e00-\u9fa5]{2,12}(?:银行|支行|分行|信用社|公司|管理局|公安局|派出所|不动产登记中心|市场监督管理局|医院|学校|村民委员会|居委会|社保中心|公积金中心))/;
const CN = '〇一二三四五六七八九';

function cnNumToInt(s) {
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  if (s === '十') return 10;
  let total = 0;
  if (s.indexOf('十') >= 0) {
    const p = s.split('十');
    total += (p[0] ? CN.indexOf(p[0]) : 1) * 10;
    total += (p[1] ? CN.indexOf(p[1]) : 0);
  } else {
    for (const c of s) total = total * 10 + CN.indexOf(c);
  }
  return total;
}

const CASENAME_STOP = /^(?:这个|那个|该|本|此|上述|新收|全部|所有|各个|每个|一个|两个|几个|这些|那些|哪些|什么|有关)/;

function parseInput(text) {
  const raw = String(text || '').trim();
  const res = { cat: '', sub: '', caseNo: '', caseName: '', start: todayStr(), absDue: '', dueMode: 'relative', extra: {}, hit: null, warns: [] };

  // 1. 案号：① 完整格式 (2026)京0105民初1234号 ② "案号xxx" ③ 独立连续数字
  const mCase = raw.match(/[（(]\s*(\d{4})\s*[）)]\s*([^\s，,。；;、]{2,24}?号)/);
  if (mCase) {
    res.caseNo = '(' + mCase[1] + ')' + mCase[2];
  } else {
    const m2 = raw.match(/[（(]\s*\d{4}\s*[）)][^\s，,。；;、]{2,24}/);
    if (m2) res.caseNo = m2[0];
    else {
      const m3 = raw.match(/(?:案号|编号)[:：是]?\s*([0-9A-Za-z\u4e00-\u9fa5（）()]{3,24})/);
      if (m3) res.caseNo = m3[1];
      else {
        // 连续数字≥4位；排除年份（后接"年"）与 ISO 日期
        const m4 = raw.match(/(?:^|[^\d年月日第])(\d{4,})(?![\d年月日号]|[-/.]\d)/);
        if (m4) res.caseNo = m4[1];
      }
    }
  }

  // 2. 案件名：① X诉Y ② "X案件/X的案子" ③ "X案"
  let work = raw;
  if (res.caseNo) work = work.split(res.caseNo).join(' ');
  work = work.replace(/[（(]\s*\d{4}\s*[）)][^\s，,。；;、]{2,24}?号/, ' ');
  const cleanedW = work.replace(/(民间借贷|买卖合同|借款合同|金融借款|离婚|劳动争议|机动车交通事故[责任]*|物业服务|房屋买卖|商品房|租赁合同|承揽合同|继承|不当得利|侵权责任|建设工程施工合同|保险合同|追偿权|票据|公司决议|合伙协议|合同|纠纷)/g, ' ');
  const mParty = cleanedW.match(/([\u4e00-\u9fa5]{2,4})\s*(?:诉|起诉)\s*([\u4e00-\u9fa5]{2,4})/);
  if (mParty) {
    res.caseName = mParty[1] + '诉' + mParty[2];
    res.extra['当事人'] = mParty[1] + '、' + mParty[2];
  } else {
    const mCN = cleanedW.match(/([\u4e00-\u9fa5A-Za-z0-9]{2,12}?)(?:的)?(?:案件|案子)/);
    let nm = mCN ? mCN[1] : '';
    if (!nm) {
      const mAN = cleanedW.match(/([\u4e00-\u9fa5]{2,6})案(?!件|号|由|情|的)/);
      if (mAN) nm = mAN[1];
    }
    nm = nm.replace(/^(?:关于|有关)/, '').trim();
    if (nm.length >= 2 && !CASENAME_STOP.test(nm)) res.caseName = nm;
  }
  // 兜底：已有案号但没识别出案件名时，取开头人名（排除业务词与时间词）
  if (!res.caseName && res.caseNo) {
    const mHead = cleanedW.trim().match(/^([\u4e00-\u9fa5]{2,4})/);
    if (mHead && !CASENAME_STOP.test(mHead[1]) &&
      !/^(保全|送达|排庭|鉴定|调查|归档|退费|上诉|文书|制作|审限|报结|开庭|谈话|判决|调解|执行|立案|今天|明天|昨天|后天|前天|上午|下午)/.test(mHead[1])) {
      res.caseName = mHead[1];
    }
  }

  // 3. 日期：明确日期 → 指定完成日；今天/昨天/收到 → 起算日
  let start = todayStr(), absDue = '', dueMode = 'relative';
  if (/(前天)/.test(raw)) start = shiftDays(todayStr(), -2);
  else if (/(昨天|昨日)/.test(raw)) start = shiftDays(todayStr(), -1);
  else if (/(明天|明日)/.test(raw)) start = shiftDays(todayStr(), 1);

  let concrete = '';
  const mISO = raw.match(/(20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (mISO) {
    concrete = mISO[1] + '-' + pad(+mISO[2]) + '-' + pad(+mISO[3]);
  } else {
    const mMD = raw.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]/);
    if (mMD) {
      const mm = +mMD[1], dd = +mMD[2];
      if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
        let dt = new Date(new Date().getFullYear(), mm - 1, dd);
        const gap = diffDays(ymd(dt), todayStr());
        if (gap > 180 || gap < -90) dt = new Date(dt.getFullYear() + 1, mm - 1, dd);
        concrete = ymd(dt);
      }
    }
  }
  if (concrete) {
    // 句中"收到/立案/受理/签收"等，说明该日期是事情发生的起点
    if (/(收到|接到|立案|受理|领取|拿到|签收)/.test(raw)) {
      start = concrete;
    } else {
      absDue = concrete; dueMode = 'absolute'; start = concrete;
    }
  }
  res.start = start; res.absDue = absDue; res.dueMode = dueMode;
  // 4. 类别
  for (const k of KW) {
    if (k.re.test(work)) { res.cat = k.cat; res.sub = k.sub; res.hit = k.re.source; break; }
  }
  // 5. 附属字段
  const mOrg = raw.match(ORG_RE);
  if (mOrg) {
    res.extra['被调查单位'] = mOrg[1];
    if (res.cat === '调查' && res.sub === '线下调查') { /* 分类保留 */ }
  }
  const mAmt = raw.match(/(\d+(?:\.\d+)?)\s*(万元|万|元)/);
  if (mAmt) res.extra['退费金额'] = mAmt[1] + (mAmt[2] === '万' || mAmt[2] === '万元' ? '万元' : '元');
  if (/(补正)/.test(raw) && res.cat === '移送上诉') res.extra['需补正'] = true;
  if (/(续行|续保)/.test(raw)) {
    const mEnd = raw.match(/(保全)?到期(?:日|时间)?[为是]?\s*(\d{4}[-/.]\d{1,2}[-/.]\d{1,2}|\d{1,2}月\d{1,2}日)/);
    if (mEnd) {
      let es = mEnd[2];
      const im = es.match(/(20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})/);
      if (im) res.endDate = im[1] + '-' + pad(+im[2]) + '-' + pad(+im[3]);
      else { const mm = es.match(/(\d{1,2})月(\d{1,2})日/); if (mm) res.endDate = new Date().getFullYear() + '-' + pad(+mm[1]) + '-' + pad(+mm[2]); }
    }
  }
  if (!res.cat) res.warns.push('未能识别业务类别，请手动选择');
  return res;
}

/* ========== 10. 视图层 ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let curTab = 'today', curBoard = '保全', q = '', fCat = '全部';
const iconOf = c => (CATS.find(x => x.k === c) || {}).ic || '•';

function sortByState(list) {
  const order = { overdue: 0, today: 1, soon: 2, upcoming: 3, flow: 4, done: 5 };
  return list.slice().sort((a, b) => {
    const sa = stateOf(a), sb = stateOf(b);
    if (order[sa] !== order[sb]) return order[sa] - order[sb];
    return (minDue(a) || '9') < (minDue(b) || '9') ? -1 : 1;
  });
}

function dueTag(t) {
  const st = stateOf(t), d = minDue(t);
  if (st === 'done') return '<span class="tag ok">已完成</span>';
  if (st === 'flow') return '<span class="tag">进度跟踪中</span>';
  if (!d) return '';
  const n = diffDays(d, todayStr());
  if (n < 0) return '<span class="tag od">逾期 ' + (-n) + ' 天</span>';
  if (n === 0) return '<span class="tag due">今日到期</span>';
  if (n <= 3) return '<span class="tag due">剩 ' + n + ' 天</span>';
  return '<span class="tag">' + fmtCN(d) + ' 到期</span>';
}

function taskItem(t) {
  const st = stateOf(t);
  const cls = st === 'overdue' ? ' od' : (st === 'today' ? ' td' : '');
  const nx = nextStep(t);
  const d = minDue(t);
  let body = '';
  if (t.cat === '退费') {
    const f = ruleOf(t).flow || [];
    body = '<div class="step">进度：<b>' + esc(f[t.flow || 0] || '—') + '</b> <span style="color:#8b96a5">(' + ((t.flow || 0) + 1) + '/' + f.length + ')</span></div>';
  } else if (nx) {
    const late = d && diffDays(d, todayStr()) < 0;
    body = '<div class="step">当前节点：<b>' + esc(nx.n) + '</b>　' +
      (late ? '<span style="color:#c62f2f">原定 ' + fmtCN(nx.due) + '</span>' : '<span style="color:#6b7787">期限 ' + fmtCN(nx.due) + '</span>') +
      (nx.done ? '' : '') + '</div>';
  } else if (t.steps.length && isAllDone(t)) {
    body = '<div class="step" style="color:#1f7a4d">全部节点已完成</div>';
  }
  const holidayHint = d && holidayName(shiftDays(d, 1)) && isWorkday(d) ? '' : '';
  return '<div class="task' + cls + '" data-open="' + t.id + '">' +
    '<div class="l1"><div style="min-width:0;flex:1">' +
      '<div class="cs">' + (t.caseNo ? esc(t.caseNo) : '<span style="color:#8b96a5">未填案号</span>') + '</div>' +
      (t.caseName ? '<div class="cname">' + esc(t.caseName) + '</div>' : '') +
    '</div></div>' +
    '<div class="l2"><span class="tag cat">' + iconOf(t.cat) + ' ' + esc(t.cat) + (t.sub && t.sub !== t.cat ? '·' + esc(t.sub) : '') + '</span>' + dueTag(t) +
    (t.dueMode === 'absolute' ? '<span class="tag">指定日</span>' : '') +
    (t.extra['需补正'] ? '<span class="tag wk">需补正</span>' : '') + '</div>' +
    body +
    '<div class="acts">' +
      (nx ? '<button class="chk" data-done="' + t.id + '">✓ 完成「' + esc(nx.n) + '」</button>' : '') +
      (t.cat === '退费' && stateOf(t) !== 'done' ? '<button class="chk" data-flow="' + t.id + '">→ 推进进度</button>' : '') +
    '</div></div>';
}

/* ---------- 今日工作台 ---------- */
function renderToday() {
  const all = DB.tasks.filter(t => t.status !== 'done');
  const over = sortByState(all.filter(t => stateOf(t) === 'overdue'));
  const today = sortByState(all.filter(t => stateOf(t) === 'today'));
  const soon = sortByState(all.filter(t => stateOf(t) === 'soon'));
  const later = sortByState(all.filter(t => stateOf(t) === 'upcoming' || stateOf(t) === 'flow'));
  const doneToday = DB.tasks.filter(t => (t.steps || []).some(s => s.done && s.doneAt === todayStr())).length;
  const w = parseYmd(todayStr()).getDay();
  const isRemind = w === DB.remindDay;

  let h = '<div class="ov">' +
    '<div class="cell r"><div class="v">' + over.length + '</div><div class="k">逾期</div></div>' +
    '<div class="cell o"><div class="v">' + today.length + '</div><div class="k">今日到期</div></div>' +
    '<div class="cell"><div class="v">' + soon.length + '</div><div class="k">3日内</div></div>' +
    '<div class="cell g"><div class="v">' + doneToday + '</div><div class="k">今日办结</div></div>' +
    '</div>';

  if (!DB.tasks.length) {
    h += '<div class="empty"><span class="big">☰</span>还没有任务<br>点下方 <b>＋</b> 输入今天要做的事<br><span style="font-size:12.5px">例如：<i>(2026)京0105民初1234号 张三诉李四 今天收到起诉状要送达</i></span></div>';
    return h;
  }

  if (over.length) {
    h += '<div class="sec-t"><span>⚠ 已逾期</span><span class="n hot">' + over.length + '</span></div><div class="card tight">' + over.map(taskItem).join('') + '</div>';
  }
  if (today.length) {
    h += '<div class="sec-t"><span>今日应办</span><span class="n warm">' + today.length + '</span></div><div class="card tight">' + today.map(taskItem).join('') + '</div>';
  }
  if (soon.length) {
    h += '<div class="sec-t"><span>3日内到期</span><span class="n">' + soon.length + '</span></div><div class="card tight">' + soon.map(taskItem).join('') + '</div>';
  }
  if (!over.length && !today.length && !soon.length) {
    h += '<div class="card" style="text-align:center;padding:26px 14px"><div style="font-size:30px;margin-bottom:6px">✓</div><div style="font-weight:600;color:#1f7a4d">今日无临期事项</div><div style="font-size:13px;color:#6b7787;margin-top:5px">后续 ' + later.length + ' 项任务在排队</div></div>';
  }
  if (later.length) {
    h += '<div class="sec-t"><span>后续待办</span><span class="n">' + later.length + '</span></div><div class="card tight">' + later.map(taskItem).join('') + '</div>';
  }
  h += renderMonthly();
  h += renderWeekly(isRemind);
  return h;
}

/* 周期性跟进提醒 */
function renderWeekly(showNow) {
  const wd = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][DB.remindDay];
  const groups = [
    { k: '保全进度跟进', ic: '🛡', list: DB.tasks.filter(t => t.cat === '保全' && t.status !== 'done') },
    { k: '鉴定进度询问', ic: '🧪', list: DB.tasks.filter(t => t.cat === '鉴定' && t.status !== 'done') },
    { k: '待写文书', ic: '✎', list: DB.tasks.filter(t => t.cat === '制作文书' && t.status !== 'done') },
    { k: '退费进度更新', ic: '¥', list: DB.tasks.filter(t => t.cat === '退费' && t.status !== 'done') },
    { k: '归档待办', ic: '📦', list: DB.tasks.filter(t => t.cat === '归档' && t.status !== 'done') },
    { k: '线下调查分类', ic: '🔍', list: DB.tasks.filter(t => t.sub === '线下调查' && t.status !== 'done') }
  ].filter(g => g.list.length);
  if (!groups.length) return '';
  let h = '<div class="sec-t"><span>每周跟进（' + wd + '）</span><span class="n">' + (showNow ? '今日' : '提示') + '</span></div>';
  if (!showNow) {
    h += '<div class="note">本周跟进清单共 ' + groups.reduce((a, g) => a + g.list.length, 0) + ' 项，每个' + wd + '集中提醒。今天不是提醒日，如需查看请到「设置」调整提醒日。</div>';
    return h;
  }
  groups.forEach(g => {
    h += '<div class="card"><div style="font-size:14px;font-weight:600;margin-bottom:9px">' + g.ic + ' ' + g.k + ' <span style="color:#6b7787;font-weight:400;font-size:12.5px">' + g.list.length + ' 项</span></div>';
    if (g.k === '线下调查分类') {
      const byOrg = {};
      g.list.forEach(t => { const o = (t.extra['被调查单位'] || '未填单位'); (byOrg[o] = byOrg[o] || []).push(t); });
      Object.keys(byOrg).forEach(o => {
        h += '<div style="margin-bottom:8px"><span class="pill" style="background:#eaf2fb;color:#2c5c8f;font-weight:600">' + esc(o) + '（' + byOrg[o].length + '）</span><br>' +
          byOrg[o].map(t => '<span style="font-size:13px;color:#44536a">' + esc(t.caseNo || '未填案号') + '</span>').join('　') + '</div>';
      });
    } else {
      g.list.forEach(t => {
        h += '<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #f0f2f6;font-size:13.5px">' +
          '<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(t.caseNo || '未填案号') + '</span>' +
          '<span style="color:#6b7787;white-space:nowrap;font-size:12.5px">' + esc(progressOf(t)) + '</span></div>';
      });
    }
    h += '</div>';
  });
  return h;
}

/* 月度提醒：每月最后一周梳理扣审、报结与归档 */
function isLastWeekOfMonth() {
  const d = new Date();
  const daysInMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  return (daysInMonth - d.getDate()) <= 6;
}
function renderMonthly() {
  const pend = DB.tasks.filter(t => t.cat === '审限扣除与报结' && t.status !== 'done');
  const arch = DB.tasks.filter(t => t.cat === '归档' && t.status !== 'done');
  const last = isLastWeekOfMonth();
  if (!last) {

    return '<div class="note">本月已登记 ' + pend.length + ' 件待扣审／报结案件。' + '<b>每月最后一周</b>集中梳理并计入当月结案统计。</div>';
  }
  let h = '<div class="sec-t"><span>本月最后一周 · 月度收尾</span><span class="n warm">待办</span></div>';

    '<div style="font-size:14px;font-weight:600;margin-bottom:8px">⏱ 审限扣除与报结</div>' +

function cellVal(t, col) {
  const e = t.extra || {};
  switch (col.k) {
    case 'seq': return e['回执序号'] || e.seqNo || '';
    case 'caseNo': return t.caseNo || '';
    case 'caseName': return t.caseName || '';
    case 'obj': return e['标的物'] || '';
    case 'party': return e['当事人'] || '';
    case 'hearTime': return e['排庭时间'] || (t.steps[0] ? t.steps[0].due : '');
    case 'remark': return e['备注'] || '';
    case 'docType': return e['文书类型'] || t.sub;
    case 'served': return progressOf(t);
    case 'org': return e['被调查单位'] || '';
    case 'back': return e['返回情况'] || '';
    case 'item': return e['鉴定事项'] || '';
    case 'prog': return progressOf(t);
    case 'who': return e['上诉方'] || '';
    case 'amount': return e['退费金额'] || '';
    case 'reason': return e['扣除事由'] || '';
    case 'end': return t.endDate || '';
  }
  return '';
}

/* ========== 11.5 语音输入 ==========
   iPhone Safari 未实现 SpeechRecognition，自动降级为系统键盘听写引导 */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const SPEECH_OK = !!SR && window.isSecureContext !== false;
let recog = null, listening = false, recogTargetId = null, recogBase = '', tipTimer = null, micReady = false;

// 复用同一个识别器实例，避免每次新建导致重复请求权限
function getRecog() {
  if (!SPEECH_OK) return null;
  if (!recog) {
    recog = new SR();
    recog.lang = 'zh-CN';
    recog.continuous = true;
    recog.interimResults = true;
    recog.maxAlternatives = 1;
  }
  return recog;
}

// 一次性取得麦克风权限，之后浏览器会记住（同源）
function ensureMic() {
  if (micReady) return Promise.resolve(true);
  let p = Promise.resolve(true);
  try {
    if (navigator.permissions && navigator.permissions.query) {
      p = navigator.permissions.query({ name: 'microphone' }).then(function (st) {
        if (st.state === 'granted') { micReady = true; return true; }
        return null;
      }).catch(function () { return null; });
    }
  } catch (e) { }
  return Promise.resolve(p).then(function (pre) {
    if (pre === true) return true;
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
        try { s.getTracks().forEach(function (t) { t.stop(); }); } catch (e) { }
        micReady = true;
        return true;
      }).catch(function () { return false; });
    }
    return true;
  });
}

function startSpeech(targetId) {
  const el = document.getElementById(targetId);
  if (!el) return;
  // iPhone Safari 等不支持网页语音 → 引导系统键盘听写
  if (!SPEECH_OK) {
    el.focus();
    showDictTip('请点键盘上的 <b>🎤</b> 图标开始听写，说完点「完成」。不同输入法位置略有差异。<br>没有麦克风图标：设置 → 通用 → 键盘 → 启用听写。');
    return;
  }
  if (listening) { stopSpeech(); return; }

  const run = function () {
    const r = getRecog();
    if (!r) { el.focus(); showDictTip('语音识别不可用，请使用键盘输入。'); return; }
    recogTargetId = targetId;
    recogBase = el.value || '';
    r.onstart = function () { listening = true; updateMicUI(true); };
    r.onresult = function (ev) {
      let interim = '', finalTxt = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const res = ev.results[i];
        if (res.isFinal) finalTxt += res[0].transcript;
        else interim += res[0].transcript;
      }
      if (finalTxt) recogBase += finalTxt;
      const t = document.getElementById(recogTargetId);
      if (t) {
        t.value = recogBase + interim;
        if (recogTargetId === 'nlpText') AD.text = t.value;
      }
    };
    r.onerror = function (ev) {
      listening = false; updateMicUI(false);
      const err = ev.error;
      if (err === 'not-allowed' || err === 'service-not-allowed')
        showDictTip('麦克风未授权。请允许麦克风权限，或直接使用键盘听写。');
      else if (err === 'network')
        showDictTip('语音服务需要联网。可直接使用键盘上的 🎤 听写。');
      else if (err === 'no-speech')
        showDictTip('没有听到声音，请再说一次。');
      else
        showDictTip('语音识别中断，可改用键盘输入。');
    };
    r.onend = function () {
      listening = false; updateMicUI(false);
      if (recogTargetId === 'nlpText') {
        const t = document.getElementById('nlpText');
        if (t && t.value.trim()) applyParse(t.value);
      }
    };
    try { r.start(); }
    catch (err) {
      try { r.stop(); } catch (e2) { }
      setTimeout(function () {
        try { r.start(); } catch (e3) { el.focus(); showDictTip('启动失败，请改用键盘输入。'); }
      }, 150);
    }
  };

  ensureMic().then(function (ok) {
    if (!ok) { el.focus(); showDictTip('麦克风权限被拒绝。请在浏览器设置中允许本页面使用麦克风，或改用键盘听写。'); return; }
    run();
  });
}
function updateMicUI(on) {
  const els = document.querySelectorAll('[data-mic]');
  for (let i = 0; i < els.length; i++) {
    const b = els[i];
    if (on) { b.classList.add('rec'); b.innerHTML = '● 聆听中'; }
    else { b.classList.remove('rec'); b.innerHTML = '🎤 语音'; }
  }
}
function showDictTip(text) {
  const box = document.getElementById('dictTip');
  if (!box) { toast(text.replace(/<[^>]+>/g, '')); return; }
  box.innerHTML = '<div class="dict-tip">' + text + '</div>';
  clearTimeout(tipTimer);
  tipTimer = setTimeout(function () { if (document.getElementById('dictTip')) document.getElementById('dictTip').innerHTML = ''; }, 8000);
}
function stopSpeech() {
  if (recog) { try { recog.stop(); } catch (e) { } }
  listening = false; updateMicUI(false);
}

  h += '<div class="field"><label>期限方式</label><div class="cats">' +

    '<button type="button" class="chip sm' + (AD.dueMode === 'absolute' ? ' on' : '') + '" data-duemode="absolute">指定完成日期</button>' +
    '</div>';
  if (AD.dueMode === 'absolute') {
    h += '<div style="margin-top:9px"><input type="date" data-f="__absDue" value="' + esc(AD.absDue) + '">' +
      '<div class="hint">该日即为本事项办结日，不再按预设天数推算；后续环节以该日为基准</div></div>';
  }
  h += '</div>';

  if (AD.sub === '续行保全') {
    h += '<div class="field"><label>保全到期日</label><input type="date" data-f="__endDate" value="' + esc(AD.endDate) + '"><div class="hint">软件将倒推 32 日作为制作裁定的期限</div></div>';
  }

  fieldDefs(AD.cat, AD.sub).forEach(f => {
    h += fieldInput(f, AD.extra[f.k], 'data-f');
  });

  if (AD.cat && AD.sub) {
    const preset = (ruleOf({ cat: AD.cat, sub: AD.sub }).steps || [])[0];
    const presetTxt = preset ? (preset.off + (preset.unit === 'w' ? ' 个工作日' : ' 个自然日')) : '—';
    h += '<div class="field"><label>自定义期限（选填）</label>' +
      '<input type="number" inputmode="numeric" min="0" data-f="__customDays" value="' + (AD.customDays === null || AD.customDays === undefined ? '' : AD.customDays) + '" placeholder="留空按预设：' + esc(presetTxt) + '">' +
      '<div class="hint">填写后仅覆盖第一个节点的期限，填 0 表示当日办结</div></div>';
  }

  if (AD.cat === '移送上诉' && AD.sub === '送达上诉状副本并开具上诉费缴费单') {
    h += '<div class="field"><label style="display:flex;align-items:center;gap:8px;font-size:14px;color:#1d2733">' +
      '<input type="checkbox" data-f="__needFix"' + (AD.needFix ? ' checked' : '') + ' style="width:20px;height:20px">需当事人补正上诉状</label>' +
      '<div class="hint">勾选后增加"3个工作日后确认补正材料"提醒节点</div></div>';
  }

  h += '<div id="pvBox"></div>';
  return h;
}

function updatePreview() {
  const box = $('#pvBox');
  if (!box) return;
  if (!AD.cat || !AD.sub) { box.innerHTML = ''; return; }
  const bak = DB.seq['保全'];
  const tmp = makeTask({ cat: AD.cat, sub: AD.sub, caseNo: AD.caseNo, caseName: AD.caseName, start: AD.start, endDate: AD.endDate, customDays: AD.customDays, dueMode: AD.dueMode, absDue: AD.absDue, extra: Object.assign({}, AD.extra, AD.needFix ? { '需补正': true } : {}) });
  DB.seq['保全'] = bak;
  if (!tmp.steps.length && tmp.cat !== '退费') { box.innerHTML = ''; return; }
  let h = '<div class="card" style="background:#fafbfd;margin-top:6px"><div style="font-size:13px;font-weight:600;color:#44536a;margin-bottom:9px">期限预览</div>';
  if (tmp.cat === '退费') {
    h += '<div style="font-size:13.5px;color:#3d4c5e">按 5 个环节推进：' + (ruleOf(tmp).flow || []).join(' → ') + '</div>';
  } else {
    h += '<div class="tl">' + tmp.steps.map((s, i) => {
      const n = diffDays(s.due, todayStr());
      return '<div class="nd' + (i === 0 ? ' now' : '') + '"><div class="nm">' + esc(s.n) + (s.opt ? ' <span class="tag wk">可选</span>' : '') + '</div>' +
        '<div class="dt">' + fmtFull(s.due) + '　<span style="color:' + (n < 0 ? '#c62f2f' : n <= 3 ? '#b26800' : '#8b96a5') + '">' +
        (n < 0 ? '已逾期' + (-n) + '天' : n === 0 ? '今日到期' : '剩' + n + '天') + '</span></div></div>';
    }).join('') + '</div>';
  }
  h += '</div>';
  box.innerHTML = h;
}

function openAdd() {
  AD = defAD(); AD.mode = 'quick'; AD.text = ''; AD.parsed = false;
  openSheet('录入任务', renderAddBody(), '<button class="btn block" id="saveTask">保存任务</button>');
  updatePreview();
}

// 解析文本并回填到录入面板（按钮与语音共用）
function applyParse(txt) {
  const p = parseInput(txt);
  AD.text = txt; AD.parsed = true;
  AD.cat = p.cat || AD.cat; AD.sub = p.sub || AD.sub;
  AD.caseNo = p.caseNo || AD.caseNo; AD.caseName = p.caseName || AD.caseName;
  AD.start = p.start || todayStr(); AD.endDate = p.endDate || '';
  AD.absDue = p.absDue || ''; AD.dueMode = p.dueMode || 'relative';
  Object.assign(AD.extra, p.extra || {});
  AD.needFix = !!p.extra['需补正'];
  const sb = $('#sheetBody');
  if (sb) sb.innerHTML = renderAddBody();
  updatePreview();
  if (p.warns.length) toast(p.warns[0]);
}

function openAddFromParse(text) {
  AD = defAD();
  const p = parseInput(text);
  AD.mode = 'quick'; AD.text = text; AD.parsed = true;
  AD.cat = p.cat; AD.sub = p.sub; AD.caseNo = p.caseNo; AD.caseName = p.caseName;
  AD.start = p.start; AD.endDate = p.endDate || '';
  AD.extra = p.extra || {};
  AD.needFix = !!p.extra['需补正'];
  openSheet('录入任务', renderAddBody(), '<button class="btn block" id="saveTask">保存任务</button>');
  setTimeout(updatePreview, 0);
}

/* ========== 13. 详情 ========== */
function openDetail(id) {
  const t = DB.tasks.find(x => x.id === id);
  if (!t) return;
  const rule = ruleOf(t);
  let h = '<div class="field"><label>案号</label><input data-e="caseNo" value="' + esc(t.caseNo) + '"></div>' +
    '<div class="field"><label>案件名 / 当事人</label><input data-e="caseName" value="' + esc(t.caseName) + '"></div>' +
    '<div class="field"><label>起算日</label><input type="date" data-e="start" value="' + esc(t.start) + '"></div>' +
    '<div class="field"><label>期限方式</label><div class="cats">' +
    '<button type="button" class="chip sm' + (t.dueMode !== 'absolute' ? ' on' : '') + '" data-tdm="relative">按预设期限</button>' +
    '<button type="button" class="chip sm' + (t.dueMode === 'absolute' ? ' on' : '') + '" data-tdm="absolute">指定完成日期</button>' +
    '</div>' +
    (t.dueMode === 'absolute'
      ? '<div style="margin-top:9px"><input type="date" data-e="absDue" value="' + esc(t.absDue) + '"><div class="hint">该日为办结日，不顺延</div></div>'
      : '') +
    '</div>';
  if (t.sub === '续行保全') h += '<div class="field"><label>保全到期日</label><input type="date" data-e="endDate" value="' + esc(t.endDate) + '"></div>';
  fieldDefs(t.cat, t.sub).forEach(f => {
    h += fieldInput(f, t.extra[f.k], 'data-x');
  });
  if (t.cat !== '退费') {
    const rule0 = (ruleOf(t).steps || [])[0];
    h += '<div class="field"><label>自定义期限（工作日，留空用预设）</label>' +
      '<input type="number" inputmode="numeric" min="0" data-e="customDays" value="' + (t.customDays === null || t.customDays === undefined ? '' : t.customDays) + '" placeholder="预设 ' + (rule0 ? esc(rule0.off + (rule0.unit === 'w' ? ' 个工作日' : ' 个自然日')) : '—') + '"></div>';
  }
  if (t.cat === '移送上诉' && rule.optStep) {
    h += '<div class="field"><label style="display:flex;align-items:center;gap:8px;font-size:14px;color:#1d2733"><input type="checkbox" data-x="需补正"' + (t.extra['需补正'] ? ' checked' : '') + ' style="width:20px;height:20px">需当事人补正上诉状</label></div>';
  }

  h += '<div class="card" style="background:#fafbfd;margin:14px 0"><div style="font-size:13px;font-weight:600;color:#44536a;margin-bottom:12px">流程节点</div>';
  if (t.cat === '退费') {
    const f = rule.flow || [];
    h += '<div class="tl">' + f.map((n, i) => '<div class="nd' + (i < (t.flow || 0) ? ' done' : i === (t.flow || 0) ? ' now' : '') + '"><div class="nm">' + esc(n) + '</div>' +
      (i === (t.flow || 0) ? '<div class="dt">当前环节</div>' : '') + '</div>').join('') + '</div>';
  } else if (!t.steps.length) {
    h += '<div style="font-size:13px;color:#8b96a5">该类别无期限节点</div>';
  } else {
    h += '<div class="tl">' + t.steps.map(s => {
      const st = s.done ? 'done' : (diffDays(s.due, todayStr()) <= 0 ? 'now' : '');
      return '<div class="nd ' + st + '"><div class="nm">' + esc(s.n) + '</div>' +
        '<div class="dt">' + fmtFull(s.due) + (s.done ? '　<span style="color:#1f7a4d">✓ ' + esc(s.doneAt) + ' 完成</span>' : '') + '</div>' +
        (!s.done ? '<button class="chk" style="margin-top:6px;padding:4px 10px;font-size:12.5px" data-stepdone="' + t.id + '|' + esc(s.n) + '">标记完成</button>' : '') +
        '</div>';
    }).join('') + '</div>';
  }
  h += '</div>';

  h += '<div class="card" style="background:#fafbfd;margin:0 0 14px"><div style="font-size:13px;font-weight:600;color:#44536a;margin-bottom:8px">办理记录</div>';
  if (t.logs && t.logs.length) {
    h += t.logs.slice().reverse().map(l => '<div style="font-size:13px;padding:5px 0;border-bottom:1px solid #eef1f5;color:#3d4c5e"><span style="color:#8b96a5;font-size:12px">' + esc(l.t) + '</span>　' + esc(l.text) + '</div>').join('');
  } else h += '<div style="font-size:13px;color:#8b96a5">暂无记录</div>';
  h += '<div style="display:flex;gap:8px;margin-top:9px"><input id="logInput" placeholder="记录一句进度，如：已联系承办人" style="flex:1;padding:9px 11px;font-size:15px;border:1px solid #d3dae5;border-radius:8px;font-family:inherit"><button type="button" class="mic" data-mic="logInput">🎤</button><button class="btn sm" id="addLog">添加</button></div><div id="dictTip"></div></div>';

  const foot = '<div class="btn-row"><button class="btn ghost" id="delTask" style="flex:0 0 84px;color:#c62f2f;border-color:#edc9c9">删除</button>' +
    '<button class="btn" id="toggleDone">' + (t.status === 'done' ? '恢复为进行中' : '标记整个任务完成') + '</button></div>';

  openSheet(t.cat + (t.sub !== t.cat ? ' · ' + t.sub : ''), h, foot);
  $('#sheet').dataset.tid = t.id;
  $('#sheet').dataset.mode = 'detail';
}

/* ========== 14. 事件 ========== */
function render() {
  const v = $('#view');
  let title = '今日工作台';
  if (curTab === 'today') { v.innerHTML = renderToday(); title = '今日工作台'; }
  else if (curTab === 'tasks') { v.innerHTML = renderTasks(); title = '全部任务'; }
  else if (curTab === 'board') { v.innerHTML = renderBoard(); title = '业务台账'; }
  else if (curTab === 'set') { v.innerHTML = renderSet(); title = '设置'; }
  $('#hTitle').textContent = title;
  const d = new Date();
  $('#hDate').textContent = d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  $('#hWeek').textContent = WEEKCN[d.getDay()] === '日' ? '周日' : '周' + WEEKCN[d.getDay()];
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === curTab));
}

document.addEventListener('click', e => {
  const tb = e.target.closest('.tabbar button');
  if (tb) {
    if (tb.dataset.tab === 'add') { openAdd(); return; }
    curTab = tb.dataset.tab;
    q = ''; fCat = '全部';
    render(); window.scrollTo(0, 0); return;
  }
  // 快捷登记（月度提醒卡片）
  const qa = e.target.closest('[data-quickadd]');
  if (qa) {
    openAdd();
    AD.mode = 'manual';
    AD.cat = qa.dataset.quickadd;
    const c = CATS.find(x => x.k === AD.cat);
    if (c) AD.sub = c.subs[0];
    $('#sheetBody').innerHTML = renderAddBody();
    updatePreview();
    return;
  }
  // 打开详情
  const op = e.target.closest('[data-open]');
  if (op && !e.target.closest('[data-done]') && !e.target.closest('[data-flow]')) { openDetail(op.dataset.open); return; }
  // 完成节点
  const dn = e.target.closest('[data-done]');
  if (dn) {
    e.stopPropagation();
    const t = DB.tasks.find(x => x.id === dn.dataset.done);
    if (t) {
      const nx = nextStep(t); if (!nx) return;
      nx.done = true; nx.doneAt = todayStr();
      t.logs = t.logs || []; t.logs.push({ t: todayStr(), text: '完成「' + nx.n + '」' });
      recalc(t); saveDB(); render(); toast('已完成：' + nx.n);
    }
    return;
  }
  // 退费推进
  const fl = e.target.closest('[data-flow]');
  if (fl) {
    e.stopPropagation();
    const t = DB.tasks.find(x => x.id === fl.dataset.flow);
    if (t) {
      const f = ruleOf(t).flow || [];
      if ((t.flow || 0) < f.length - 1) {
        t.flow = (t.flow || 0) + 1;
        t.logs = t.logs || []; t.logs.push({ t: todayStr(), text: '进度推进至：' + f[t.flow] });
        saveDB(); render(); toast('已推进至：' + f[t.flow]);
      } else { toast('已到最后一个环节，可标记完成'); }
    }
    return;
  }
  // 详情内节点完成
  const sd = e.target.closest('[data-stepdone]');
  if (sd) {
    const [tid, sname] = sd.dataset.stepdone.split('|');
    const t = DB.tasks.find(x => x.id === tid);
    const s = t && t.steps.find(x => x.n === sname);
    if (s) {
      s.done = true; s.doneAt = todayStr();
      t.logs = t.logs || []; t.logs.push({ t: todayStr(), text: '完成「' + s.n + '」' });
      recalc(t); saveDB(); closeSheet(); render(); toast('已完成：' + s.n);
    }
    return;
  }
  // 任务筛选
  const fc = e.target.closest('[data-fcat]');
  if (fc) { fCat = fc.dataset.fcat; render(); return; }
  // 类别选择
  const sc = e.target.closest('[data-setcat]');
  if (sc) {
    AD.cat = sc.dataset.setcat;
    const c = CATS.find(x => x.k === AD.cat);
    if (c && !c.subs.includes(AD.sub)) AD.sub = c.subs[0];
    $('#sheetBody').innerHTML = renderAddBody(); updatePreview(); return;
  }
  const ss = e.target.closest('[data-setsub]');
  if (ss) {
    AD.sub = ss.dataset.setsub;
    $('#sheetBody').innerHTML = renderAddBody(); updatePreview(); return;
  }
  // 期限方式切换（录入面板）
  const dm = e.target.closest('[data-duemode]');
  if (dm) {
    AD.dueMode = dm.dataset.duemode;
    if (AD.dueMode === 'absolute' && !AD.absDue) AD.absDue = AD.start;
    $('#sheetBody').innerHTML = renderAddBody(); updatePreview(); return;
  }
  // 期限方式切换（详情面板）
  const tdm = e.target.closest('[data-tdm]');
  if (tdm) {
    const tt = DB.tasks.find(x => x.id === $('#sheet').dataset.tid);
    if (tt) {
      tt.dueMode = tdm.dataset.tdm;
      if (tt.dueMode === 'absolute' && !tt.absDue) tt.absDue = tt.start;
      recalc(tt); saveDB(); openDetail(tt.id);
    }
    return;
  }
  // 模式切换
  const md = e.target.closest('[data-mode]');
  if (md) { AD.mode = md.dataset.mode; $('#sheetBody').innerHTML = renderAddBody(); updatePreview(); return; }
  // 解析
  if (e.target.id === 'parseBtn') {
    const txt = ($('#nlpText') || {}).value || '';
    if (!txt.trim()) { toast('请先描述这件工作'); return; }
    applyParse(txt);
    return;
  }
  // 语音输入
  const micBtn = e.target.closest('[data-mic]');
  if (micBtn) { startSpeech(micBtn.dataset.mic); return; }
  // 保存任务
  if (e.target.id === 'saveTask') {
    if (!AD.cat) { toast('请选择业务类别'); return; }
    if (!AD.sub) { toast('请选择具体事项'); return; }
    const t = makeTask({ cat: AD.cat, sub: AD.sub, caseNo: AD.caseNo, caseName: AD.caseName, start: AD.start, endDate: AD.endDate, customDays: AD.customDays, dueMode: AD.dueMode, absDue: AD.absDue, extra: Object.assign({}, AD.extra, AD.needFix ? { '需补正': true } : {}) });
    t.logs = [{ t: todayStr(), text: '创建任务' }];
    DB.tasks.push(t); saveDB(); closeSheet(); render();
    toast('已归类：' + t.cat + ' · ' + t.sub);
    return;
  }
  // 关闭
  if (e.target.id === 'sheetX' || e.target.id === 'mask') { closeSheet(); return; }
  // 详情操作
  if (e.target.id === 'toggleDone') {
    const t = DB.tasks.find(x => x.id === $('#sheet').dataset.tid);
    if (t) { t.status = t.status === 'done' ? 'doing' : 'done'; saveDB(); closeSheet(); render(); toast(t.status === 'done' ? '任务已完成' : '已恢复'); }
    return;
  }
  if (e.target.id === 'delTask') {
    const tid = $('#sheet').dataset.tid;
    const t = DB.tasks.find(x => x.id === tid);
    if (t && confirm('确定删除任务「' + (t.caseNo || '未填案号') + ' · ' + t.sub + '」？删除后不可恢复。')) {
      DB.tasks = DB.tasks.filter(x => x.id !== tid); saveDB(); closeSheet(); render(); toast('已删除');
    }
    return;
  }
  if (e.target.id === 'addLog') {
    const inp = $('#logInput'); const txt = (inp.value || '').trim();
    if (!txt) return;
    const t = DB.tasks.find(x => x.id === $('#sheet').dataset.tid);
    if (t) { t.logs = t.logs || []; t.logs.push({ t: todayStr(), text: txt }); saveDB(); openDetail(t.id); toast('已记录'); }
    return;
  }
  // 设置页
  if (e.target.id === 'expBtn') { exportJSON(); return; }
  if (e.target.id === 'micGrant') {
    ensureMic().then(function (ok) {
      toast(ok ? '麦克风已授权，之后不再询问' : '授权未完成，请检查浏览器麦克风权限');
      render();
    });
    return;
  }
  if (e.target.id === 'expCsvBtn') { exportCSV(); return; }
  if (e.target.id === 'impBtn') { $('#impFile').click(); return; }
  if (e.target.id === 'clearBtn') {
    if (confirm('将清空全部任务数据，且无法恢复。确定继续？')) {
      if (confirm('再次确认：所有任务与台账记录都会被删除，建议先导出备份。')) {
        DB.tasks = []; DB.seq = { 保全: 1 }; saveDB(); render(); toast('已清空');
      }
    }
    return;
  }
  if (e.target.id === 'addHoliday') {
    const d = prompt('输入日期（格式 2027-01-01）：');
    if (!d) return;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { toast('日期格式不正确'); return; }
    const n = prompt('节假日名称（如：元旦）：') || '节假日';
    DB.holidays[d] = n; refreshCal(); saveDB(); render(); toast('已添加'); return;
  }
  const dh = e.target.closest('[data-delhol]');
  if (dh) {
    const d = dh.dataset.delhol;
    if (confirm('删除节假日 ' + d + ' ' + (DB.holidays[d] || '') + '？')) {
      delete DB.holidays[d]; refreshCal(); saveDB(); render();
    }
    return;
  }
});

// 输入绑定
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') {
    q = el.value;
    const tl = $('#taskList');
    if (tl) tl.innerHTML = taskListHTML();
    return;
  }
  if (el.id === 'nlpText') { AD.text = el.value; return; }
  if (el.dataset.f) {
    const k = el.dataset.f;
    if (k === '__caseNo') AD.caseNo = el.value;
    else if (k === '__caseName') AD.caseName = el.value;
    else if (k === '__start') AD.start = el.value || todayStr();
    else if (k === '__endDate') AD.endDate = el.value;
    else if (k === '__needFix') AD.needFix = el.checked;
    else if (k === '__customDays') AD.customDays = el.value === '' ? null : Number(el.value);
    else if (k === '__absDue') AD.absDue = el.value;
    else AD.extra[k] = el.value;
    updatePreview(); return;
  }
  if (el.dataset.e) {
    const t = DB.tasks.find(x => x.id === $('#sheet').dataset.tid);
    if (t) {
      if (el.dataset.e === 'customDays') t.customDays = el.value === '' ? null : Number(el.value);
      else t[el.dataset.e] = el.value;
      recalc(t); saveDB();
    }
    return;
  }
  if (el.dataset.x) {
    const t = DB.tasks.find(x => x.id === $('#sheet').dataset.tid);
    if (t) {
      if (el.type === 'checkbox') t.extra[el.dataset.x] = el.checked;
      else t.extra[el.dataset.x] = el.value;
      recalc(t); saveDB();
    }
    return;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'boardSel') { curBoard = e.target.value; render(); return; }
  if (e.target.id === 'impFile') { importJSON(e.target.files[0]); e.target.value = ''; return; }
  if (e.target.id === 'remindDay') { DB.remindDay = parseInt(e.target.value, 10); saveDB(); toast('已设置每周提醒日'); return; }
});

/* ========== 15. 导入导出 ========== */
function exportJSON() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '法官助理工作台-备份-' + todayStr() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('备份已导出');
}
function importJSON(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (!o.tasks || !Array.isArray(o.tasks)) throw new Error('格式不符');
      if (!confirm('将用备份文件覆盖当前数据（' + DB.tasks.length + ' 条），确定导入？')) return;
      DB = Object.assign(DB, o);
      HOL = DB.holidays; MAKEUP = new Set(DB.makeup);
      (DB.tasks || []).forEach(t => recalc(t));
      saveDB(); render(); toast('导入成功，共 ' + DB.tasks.length + ' 条');
    } catch (err) { alert('导入失败：文件格式不正确'); }
  };
  r.readAsText(file);
}
function exportCSV() {
  let out = '\ufeff';
  BOARDS.forEach(b => {
    let rows = DB.tasks.filter(t => b.cats.includes(t.cat));
    if (b.subs) rows = rows.filter(t => b.subs.includes(t.sub));
    if (!rows.length) return;
    out += b.name + '\n';
    out += b.cols.map(c => '"' + c.l + '"').join(',') + '\n';
    rows.forEach(t => { out += b.cols.map(c => '"' + String(cellVal(t, c)).replace(/"/g, '""') + '"').join(',') + '\n'; });
    out += '\n';
  });
  const blob = new Blob([out], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '法官助理台账-' + todayStr() + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('台账已导出');
}

  const now = new Date();
  const s = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日';
